[General]
; Physical key to hold. F12 is the default; F10 avoids Steam's default screenshot key.
ToggleKey=F12

; A tap shorter than this does nothing. Valid range: 50..10000 milliseconds.
HoldDurationMs=300

; Read HideMainInterface_0/_1 from DA2 KeyBindings.ini when available.
AutoDetectHideInterfaceKey=true

; Fallback used when auto-detection is disabled or no supported binding is found.
HideInterfaceKey=V

; Press once while DA2 is focused to restore only when tracked state is hidden.
EmergencyRestoreKey=F11

; Auto = Documents\BioWare\Dragon Age 2\Settings\KeyBindings.ini
KeyBindingsPath=Auto

; Strongly recommended. If false, the native UI key is sent to the foreground app.
OnlyWhenGameFocused=true

; Physical keyboard polling interval. Valid range: 5..100 milliseconds.
PollIntervalMs=10

; Writes DA2CinematicUIHider.log in bin_ship. No per-frame logging.
Debug=false
